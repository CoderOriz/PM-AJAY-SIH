# tasks.yaml - dependency-ordered work items for the implementing agent.
#
# How to use:
#   - Pick the lowest-ID task with owner in {agent, joint}, status "todo", and all depends_on "done".
#   - status values: todo | in_progress | done | blocked_by_human
#   - When finished: set status: done and add `evidence:` (command + result).
#   - owner: agent = you do it all; joint = you build everything possible (interfaces, fakes, stubs,
#     contract tests) and a human completes the rest (see docs/HUMAN_TASKS.md); human = not yours.
#   - priority: P0 = pilot-blocking, P1 = pilot-important, P2 = after pilot-critical path.
#   - spec: section references into docs/SPEC.md. INV-xx references into AGENTS.md section 4.
#   - acceptance: every item must be verifiably true; items beginning "RUN:" are commands that must exit 0.

version: 1

milestones:
  M0: "Foundations: repo, contracts, schema, crypto, observability core, provider fakes"
  M1: "Data + core engine: produces the Recommendation Packet from a profile"
  M2: "Voice + SMS: IVR flow, ASR router, notification orchestrator, inbound SMS"
  M3: "WhatsApp, PWA/kiosk, router/degrade ladder, browser companion"
  M4: "Debuggability: health, canaries, alerts, timeline, replay, runbooks, metrics"
  M5: "Admin, auth, follow-up/outcomes, exports, erasure/retention"
  M6: "Hardening: fault injection, load, low-connectivity, security, IaC, drills"
  M7: "Pilot readiness gate"
  M8: "Extensibility hooks for other states/languages"

